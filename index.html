<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBuddy – Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1A1733;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #7C3AED, #8B5CF6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    p { color: #94A3B8; margin-bottom: 40px; }
    .cards {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 400px;
    }
    a.card {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(139,92,246,0.08);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none; color: #E2E8F0;
      transition: background 0.2s;
    }
    a.card:hover { background: rgba(139,92,246,0.15); }
    .card-left { display: flex; align-items: center; gap: 14px; }
    .icon {
      width: 40px; height: 40px;
      background: rgba(139,92,246,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .card-title { font-weight: 600; font-size: 0.95rem; }
    .card-sub { font-size: 0.78rem; color: #94A3B8; margin-top: 2px; }
    .chevron { color: #6B7280; font-size: 1.2rem; }
    footer { margin-top: 48px; font-size: 0.75rem; color: #4B5563; }
  </style>
</head>
<body>
  <div class="logo">💜</div>
  <h1>FinBuddy</h1>
  <p>Personal Finance Tracker</p>
  <div class="cards">
    <a class="card" href="/finBuddy-legal/privacy-policy/">
      <div class="card-left">
        <div class="icon">🔒</div>
        <div>
          <div class="card-title">Privacy Policy</div>
          <div class="card-sub">How we handle your data</div>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
    <a class="card" href="/finBuddy-legal/terms/">
      <div class="card-left">
        <div class="icon">📄</div>
        <div>
          <div class="card-title">Terms &amp; Conditions</div>
          <div class="card-sub">Rules for using the app</div>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
    <a class="card" href="/finBuddy-legal/support/">
      <div class="card-left">
        <div class="icon">💬</div>
        <div>
          <div class="card-title">Contact &amp; Support</div>
          <div class="card-sub">Get help or send feedback</div>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
  </div>
  <footer>© 2026 FinBuddy. All rights reserved.</footer>
</body>
</html>
